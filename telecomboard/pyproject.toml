[project]
name = "switchboard"
version = "0.1.0"
description = "Authorization-aware telecom assistant with guarded tools (synthetic data only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "pydantic>=2.8",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "hypothesis>=6.100"]
llm = ["google-genai>=1.0"]
adk = ["google-adk>=1.0"]
mcp = ["mcp>=1.9,<2"]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
permit = ["permit>=2.7"]
evals = ["deepeval>=2.0"]
neo4j = ["neo4j>=5.20"]
langchain = ["langchain>=1.0", "langchain-community>=0.4", "pymupdf>=1.24"]
all = ["switchboard[dev,llm,adk,mcp,otel,permit,evals,neo4j,langchain]"]

[project.scripts]
switchboard = "switchboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["src", "."]
addopts = "-p no:deepeval -p no:langsmith_plugin"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "ASYNC"]
ignore = ["B008", "E501", "B905"]
per-file-ignores = {"evals/run_evals.py" = ["E402"]}
